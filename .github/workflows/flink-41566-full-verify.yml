name: FLINK-41566 full verification
on:
  push:
    branches: [validation-flink-41566-full-verify]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a470d0f77b49838093fc755efa29e1caaa7ee5ab
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Full clean verify
        shell: bash
        env:
          MAVEN_OPTS: -Xmx2048m
          JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4
        run: |
          set -o pipefail
          free -h
          df -h .
          java -version
          ./mvnw -B -ntp -Dflink.reuseForks=false -fae clean verify 2>&1 | tee full-verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flink-41566-full-verification
          path: |
            full-verify.log
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
            **/target/failsafe-reports/*.xml
            **/target/failsafe-reports/*.txt
          retention-days: 14
